<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - TechUse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">⚡ TechUse</a>
            <button class="hamburger" id="hamburger-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="custom-build.html">Build Now</a></li>
                <li><a href="about-us.html">About</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="search-container">
            <div class="search-header">
                <h1>🔍 Search Products</h1>
                <p>Find exactly what you're looking for</p>
            </div>

            <form id="search-form">
                <div class="form-group">
                    <input type="text" id="search-input" name="search" placeholder="Search cases, grips, protectors..." required>
                </div>
                <button type="submit" class="cta-button" style="width: 100%; text-align: center;">Search</button>
            </form>

            <div id="search-results" class="search-results">
                <!-- Results will load here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 TechUse. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger-menu');
        const navMenu = document.getElementById('nav-menu');
        if (hamburger && navMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navMenu.classList.toggle('active');
            });
            navMenu.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                });
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
